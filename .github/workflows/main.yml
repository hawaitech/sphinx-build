on: [push]

jobs:
  build-html:
    runs-on: ubuntu-latest
    name: Build html job
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Sphinx-builder
      uses: hawaitech/sphinx-build@v3.2
      with:
        build-root: "/github/workspace"
        ref_name: ${{ github.ref_name }}
